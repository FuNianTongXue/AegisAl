name: Cross-platform seven-day trial build

on:
  pull_request:
    paths:
      - "app/**"
      - "config/semgrep/**"
      - "desktop/SecFlowTauri/**"
      - "scripts/build_tauri_**"
      - "requirements*.txt"
      - ".github/workflows/cross-platform-release-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x86-64:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install build dependencies
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          pnpm --dir desktop/SecFlowTauri install --frozen-lockfile
      - name: Build Windows x86_64 seven-day trial
        shell: pwsh
        run: ./scripts/build_tauri_windows.ps1 -Edition trial -OutputDir dist/windows-x86_64/trial
      - uses: actions/upload-artifact@v4
        with:
          name: secflow-v1.3.3-windows-x86-64-trial-7days
          path: dist/windows-x86_64/trial/*.exe
          if-no-files-found: error
          retention-days: 7

  macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      PYTHON_BIN: python3
      SECFLOW_MACOS_ARCH: x86_64
      SECFLOW_TAURI_TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "x64"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Install build dependencies
        run: |
          test "$(uname -m)" = "x86_64"
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-macos.txt
          pnpm --dir desktop/SecFlowTauri install --frozen-lockfile
      - name: Build macOS Intel seven-day trial
        run: |
          bash scripts/build_tauri_macos_trial.sh
          mkdir -p dist/macos-x86_64/trial
          cp "desktop/SecFlowTauri/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/安全智脑 7 天试用版_1.3.3_x64.dmg" \
            dist/macos-x86_64/trial/SecFlow-v1.3.3-macOS-x86_64-Trial-7Days.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: secflow-v1.3.3-macos-x86-64-trial-7days
          path: dist/macos-x86_64/trial/*.dmg
          if-no-files-found: error
          retention-days: 7

  macos-arm64:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      PYTHON_BIN: python3
      SECFLOW_MACOS_ARCH: arm64
      SECFLOW_TAURI_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: "arm64"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install build dependencies
        run: |
          test "$(uname -m)" = "arm64"
          corepack enable
          corepack prepare pnpm@10.13.1 --activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-macos.txt
          pnpm --dir desktop/SecFlowTauri install --frozen-lockfile
      - name: Build macOS ARM64 seven-day trial
        run: |
          bash scripts/build_tauri_macos_trial.sh
          mkdir -p dist/macos-arm64/trial
          cp "desktop/SecFlowTauri/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/安全智脑 7 天试用版_1.3.3_aarch64.dmg" \
            dist/macos-arm64/trial/SecFlow-v1.3.3-macOS-ARM64-Trial-7Days.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: secflow-v1.3.3-macos-arm64-trial-7days
          path: dist/macos-arm64/trial/*.dmg
          if-no-files-found: error
          retention-days: 7
